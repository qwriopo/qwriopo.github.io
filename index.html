<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Drag & Slash Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Drag & Slash</h1>
        <p>마우스로 선을 그어 적을 처치하세요! (Score: <span id="score">0</span>)</p>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 게임 상태
        let player = { x: canvas.width/2, y: canvas.height/2, radius: 15, color: '#00ffcc', isMoving: false };
        let enemies = [];
        let score = 0;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragEnd = { x: 0, y: 0 };
        let targetPos = { x: 0, y: 0 };

        // 적 생성
        function spawnEnemy() {
            const radius = 20;
            enemies.push({
                x: Math.random() * (canvas.width - radius * 2) + radius,
                y: Math.random() * (canvas.height - radius * 2) + radius,
                radius: radius,
                color: '#ff4444'
            });
        }

        // 초기 적 5마리 생성
        for(let i=0; i<5; i++) spawnEnemy();

        // 마우스 이벤트
        canvas.addEventListener('mousedown', (e) => {
            if (player.isMoving) return;
            isDragging = true;
            dragStart = { x: player.x, y: player.y };
            dragEnd = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                dragEnd = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            player.isMoving = true;
            targetPos = { x: e.clientX, y: e.clientY };
        });

        function update() {
            if (player.isMoving) {
                // 선형 보간(Lerp)으로 플레이어 이동
                const dx = targetPos.x - player.x;
                const dy = targetPos.y - player.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance > 5) {
                    player.x += dx * 0.2; // 이동 속도 조절
                    player.y += dy * 0.2;

                    // 이동 경로상의 적 충돌 확인
                    enemies = enemies.filter(enemy => {
                        const edx = enemy.x - player.x;
                        const edy = enemy.y - player.y;
                        const dist = Math.sqrt(edx*edx + edy*edy);
                        if (dist < player.radius + enemy.radius) {
                            score += 10;
                            scoreEl.innerText = score;
                            spawnEnemy(); // 적 처치 시 새로 생성
                            return false;
                        }
                        return true;
                    });
                } else {
                    player.x = targetPos.x;
                    player.y = targetPos.y;
                    player.isMoving = false;
                }
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(26, 26, 26, 0.3)'; // 잔상 효과
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 가이드 라인 (드래그 중일 때)
            if (isDragging) {
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(dragEnd.x, dragEnd.y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 적 그리기
            enemies.forEach(enemy => {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI*2);
                ctx.fillStyle = enemy.color;
                ctx.fill();
                ctx.closePath();
            });

            // 플레이어 그리기
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;

            update();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
