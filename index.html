<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마우스 행동 연구</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family: "Pretendard", "Noto Sans KR", sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color:white; overflow:hidden; }
        #startScreen, #finishScreen { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; background:rgba(15,23,42,.95); z-index:1000; }
        .card { width:min(700px,90vw); background:rgba(255,255,255,.08); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.15); border-radius:24px; padding:40px; text-align:center; }
        button { border:none; border-radius:14px; padding:16px 32px; font-size:18px; cursor:pointer; background:#3b82f6; color:white; transition:.2s; }
        button:hover { transform:translateY(-2px); }
        #target { width:56px; height:56px; border-radius:50%; position:absolute; display:none; cursor:pointer; background:radial-gradient(circle at 30% 30%, #ff8a8a, #ef4444); box-shadow:0 0 25px rgba(239,68,68,.7); }
        #finishScreen { display:none; }
    </style>
</head>
<body>
<div id="startScreen">
    <div class="card">
        <h1>🖱️ 마우스 행동 연구</h1>
        <p>화면에 나타나는 목표를 클릭해주세요.</p>
        <button id="startBtn">실험 시작</button>
    </div>
</div>
<div id="target"></div>
<div id="finishScreen">
    <div class="card">
        <h1>📤 제출 중...</h1>
        <p id="finishText">데이터를 서버로 전송하고 있습니다.</p>
    </div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzzlRpzbxMC4XAd0zHoNueq-oRjx6raQ49PILvdhvlKgA8d2jHx8480CATMAyKsE08lw/exec";
const TARGET_COUNT = 20;
let clicks = 0, lastTargetTime = 0, totalDistance = 0;
let reactionTimes = [], speedSamples = [], prevMouse = null;
let mouseEvents = [];
let clickEvents = [];

const userId = crypto.randomUUID(), sessionId = crypto.randomUUID();

document.addEventListener("mousemove", e => {
    const now = performance.now();
    if(prevMouse){
        const dist = Math.sqrt((e.clientX - prevMouse.x)**2 + (e.clientY - prevMouse.y)**2);
        const dt = now - prevMouse.t;
        if(dt > 0) { totalDistance += dist; speedSamples.push(dist/dt); }
    }
    prevMouse = { x:e.clientX, y:e.clientY, t:now };

    const last = mouseEvents[mouseEvents.length - 1];
    if(!last || now - last.t >= 25) {
        mouseEvents.push({ x: e.clientX, y: e.clientY, t: Math.round(now) });
    }
});

function placeTarget(){
    target.style.left = Math.random() * (window.innerWidth-56) + "px";
    target.style.top = Math.random() * (window.innerHeight-56) + "px";
    target.style.display = "block";
    lastTargetTime = performance.now();
}

target.addEventListener("click", e => {
    const now = performance.now();
    reactionTimes.push(now - lastTargetTime);
    clickEvents.push({ x: e.clientX, y: e.clientY, t: Math.round(now) });
    clicks++;
    if(clicks >= TARGET_COUNT) finishTest();
    else placeTarget();
});

async function finishTest(){
    target.style.display = "none";
    finishScreen.style.display = "flex";

    const avgReactionTime = Math.round(reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length);
    const avgSpeed = Number((speedSamples.reduce((a,b)=>a+b,0)/speedSamples.length).toFixed(4));
    const speedVariance = Number((speedSamples.reduce((a,b)=>a+(b-avgSpeed)**2,0)/speedSamples.length).toFixed(6));
    const intervals = clickEvents.slice(1).map((c,i) => c.t - clickEvents[i].t);
    const meanInterval = intervals.reduce((a,b)=>a+b,0)/intervals.length;
    const intervalVariance = Number((intervals.reduce((a,b)=>a+(b-meanInterval)**2,0)/intervals.length).toFixed(2));

    try {
        // ✅ GET → POST로 변경, body에 JSON으로 전송
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
                userId,
                sessionId,
                targetCount: TARGET_COUNT,
                avgReactionTime,
                avgSpeed,
                totalDistance: Math.round(totalDistance),
                speedVariance,
                intervalVariance,
                mouseEvents,   // 배열 그대로 (JSON.stringify 불필요)
                clickEvents
            })
        });
        finishText.innerHTML = "✅ 데이터 제출 완료<br><br>참여해주셔서 감사합니다.";
    } catch(err) {
        finishText.innerHTML = "❌ 전송 실패<br><br>F12 콘솔을 확인하세요.";
    }
}

document.getElementById("startBtn").addEventListener("click", () => {
    document.getElementById("startScreen").style.display = "none";
    placeTarget();
});
</script>
</body>
</html>
