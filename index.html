<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Rope Dash Improved Map</title>
<style>
body { margin:0; overflow:hidden; background:#0b0f14; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// 카메라
let camera = { x:0, y:0, shake:0, zoom:1 };

// 슬로우모션
let slowMotion = false;
let slowTimer = 0;
const SLOW_DURATION = 60;

// 충격파
let shockwaves = [];

// 플레이어
let player = {
    x:200, y:1000,
    vx:0, vy:0,
    radius:10,
    onGround:false,
    dash:false,
    trail:[],
    canRope:true,

    dashStartX:0,
    dashStartY:0,
    dashTargetX:0,
    dashTargetY:0,
    dashProgress:0
};

// 로프
let rope = { aiming:false, x:0, y:0 };

// 🔥 교체된 메트로배니아 맵
let platforms = [

    { x:-200, y:-200, w:5200, h:200 },
    { x:-200, y:1400, w:5200, h:200 },
    { x:-200, y:0, w:200, h:1400 },
    { x:5000, y:0, w:200, h:1400 },

    { x:0, y:1100, w:600, h:40 },
    { x:200, y:1000, w:120, h:20 },
    { x:350, y:900, w:120, h:20 },
    { x:0, y:800, w:40, h:300 },

    { x:600, y:1100, w:200, h:40 },
    { x:750, y:1000, w:120, h:20 },
    { x:650, y:900, w:120, h:20 },
    { x:800, y:800, w:120, h:20 },
    { x:700, y:700, w:120, h:20 },
    { x:850, y:600, w:120, h:20 },
    { x:950, y:550, w:40, h:600 },

    { x:1000, y:1100, w:900, h:40 },
    { x:1200, y:1000, w:200, h:20 },
    { x:1500, y:900, w:200, h:20 },
    { x:1800, y:800, w:200, h:20 },

    { x:2100, y:1050, w:500, h:40 },
    { x:2100, y:850, w:500, h:40 },
    { x:2100, y:850, w:40, h:200 },
    { x:2560, y:850, w:40, h:200 },

    { x:2700, y:1100, w:500, h:40 },
    { x:2800, y:1000, w:100, h:20 },
    { x:3000, y:900, w:100, h:20 },
    { x:3200, y:800, w:100, h:20 },
    { x:3400, y:700, w:100, h:20 },

    { x:3600, y:1100, w:600, h:40 },

    { x:600, y:400, w:300, h:20 },
    { x:1000, y:350, w:300, h:20 },
    { x:1400, y:300, w:300, h:20 },
    { x:1800, y:250, w:300, h:20 },
    { x:2200, y:300, w:300, h:20 },

    { x:2200, y:300, w:40, h:500 },
    { x:1400, y:300, w:40, h:600 },

    { x:4300, y:1100, w:600, h:40 },
    { x:4400, y:1000, w:150, h:20 },
    { x:4600, y:900, w:150, h:20 },
    { x:4800, y:800, w:150, h:20 },

    { x:5000, y:1100, w:800, h:40 },
    { x:5200, y:950, w:200, h:20 },
    { x:5500, y:900, w:200, h:20 }
];

// 입력
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// 마우스
canvas.addEventListener("mousedown", (e)=>{
    if(!player.canRope) return;

    rope.aiming = true;
    rope.x = e.clientX + camera.x;
    rope.y = e.clientY + camera.y;

    slowMotion = true;
    slowTimer = SLOW_DURATION;
});

canvas.addEventListener("mousemove", (e)=>{
    if(rope.aiming){
        rope.x = e.clientX + camera.x;
        rope.y = e.clientY + camera.y;
    }
});

canvas.addEventListener("mouseup", ()=>{
    if(!rope.aiming || !player.canRope) return;

    let dx = rope.x - player.x;
    let dy = rope.y - player.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if(dist > 10){
        player.dash = true;
        player.canRope = false;

        player.dashStartX = player.x;
        player.dashStartY = player.y;
        player.dashTargetX = rope.x;
        player.dashTargetY = rope.y;
        player.dashProgress = 0;

        camera.shake = 5;
        camera.zoom = 1.1;
    }

    rope.aiming = false;
    slowMotion = false;
});

// 충돌
function checkCollision(nx, ny){
    for(let p of platforms){
        if(nx > p.x && nx < p.x + p.w){
            if(ny + player.radius > p.y && ny + player.radius < p.y + p.h){
                return p;
            }
        }
    }
    return null;
}

function update(){
    if(player.dash){
        player.dashProgress += 0.12;

        let t = player.dashProgress;
        let ease = 1 - Math.pow(1 - t, 3);

        let targetX = player.dashStartX + (player.dashTargetX - player.dashStartX) * ease;
        let targetY = player.dashStartY + (player.dashTargetY - player.dashStartY) * ease;

        let steps = 10;
        let dx = (targetX - player.x) / steps;
        let dy = (targetY - player.y) / steps;

        for(let i=0;i<steps;i++){
            let nx = player.x + dx;
            let ny = player.y + dy;

            let hit = checkCollision(nx, ny);
            if(hit){
                player.y = hit.y - player.radius;
                player.dash = false;
                return;
            }

            player.x = nx;
            player.y = ny;
        }

    } else {
        if(keys["a"] || keys["ArrowLeft"]) player.vx = -4;
        else if(keys["d"] || keys["ArrowRight"]) player.vx = 4;
        else player.vx *= 0.8;

        if((keys["w"] || keys[" "] || keys["ArrowUp"]) && player.onGround){
            player.vy = -10;
            player.onGround = false;
        }

        player.vy += 0.5;
        player.x += player.vx;
        player.y += player.vy;
    }

    player.onGround = false;
    platforms.forEach(p=>{
        if(player.x > p.x && player.x < p.x + p.w){
            if(player.y + player.radius > p.y && player.y + player.radius < p.y + p.h){
                player.y = p.y - player.radius;
                player.vy = 0;
                player.onGround = true;
                player.canRope = true;
            }
        }
    });

    camera.x = player.x - canvas.width/2;
    camera.y = player.y - canvas.height/2;
}

function draw(){
    ctx.fillStyle = "#0b0f14";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#1f2a38";
    platforms.forEach(p=>{
        ctx.fillRect(p.x - camera.x, p.y - camera.y, p.w, p.h);
    });

    if(rope.aiming){
        ctx.beginPath();
        ctx.moveTo(player.x - camera.x, player.y - camera.y);
        ctx.lineTo(rope.x - camera.x, rope.y - camera.y);
        ctx.strokeStyle = "white";
        ctx.stroke();
    });

    ctx.beginPath();
    ctx.arc(player.x - camera.x, player.y - camera.y, player.radius, 0, Math.PI*2);
    ctx.fillStyle = "#00ffcc";
    ctx.fill();

    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
