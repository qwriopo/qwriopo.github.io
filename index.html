<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Rope Action Prototype</title>
<style>
body { margin:0; overflow:hidden; background:#111; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// 카메라
let camera = { x:0, y:0 };

// 플레이어
let player = {
    x:200,
    y:200,
    vx:0,
    vy:0,
    radius:10,
    onGround:false
};

// 로프
let rope = {
    active:false,
    x:0,
    y:0
};

// 간단한 지형
let platforms = [
    { x:0, y:500, w:2000, h:40 }, // 바닥
    { x:300, y:400, w:200, h:20 },
    { x:700, y:350, w:200, h:20 },
    { x:1100, y:300, w:200, h:20 }
];

// 입력
let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// 로프 발사
canvas.addEventListener("mousedown", (e)=>{
    rope.active = true;
    rope.x = e.clientX + camera.x;
    rope.y = e.clientY + camera.y;
});

canvas.addEventListener("mouseup", ()=>{
    rope.active = false;
});

function update(){
    // 좌우 이동
    if(keys["a"] || keys["ArrowLeft"]) player.vx = -4;
    else if(keys["d"] || keys["ArrowRight"]) player.vx = 4;
    else player.vx *= 0.8;

    // 점프
    if((keys["w"] || keys["ArrowUp"] || keys[" "]) && player.onGround){
        player.vy = -10;
        player.onGround = false;
    }

    // 중력
    player.vy += 0.5;

    // 로프 당기기
    if(rope.active){
        let dx = rope.x - player.x;
        let dy = rope.y - player.y;
        player.vx += dx * 0.01;
        player.vy += dy * 0.01;
    }

    player.x += player.vx;
    player.y += player.vy;

    // 충돌
    player.onGround = false;
    platforms.forEach(p=>{
        if(player.x > p.x && player.x < p.x + p.w){
            if(player.y + player.radius > p.y && player.y + player.radius < p.y + p.h){
                player.y = p.y - player.radius;
                player.vy = 0;
                player.onGround = true;
            }
        }
    });

    // 카메라 따라가기
    camera.x = player.x - canvas.width/2;
    camera.y = player.y - canvas.height/2;
}

function draw(){
    ctx.fillStyle = "#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 지형
    ctx.fillStyle = "#555";
    platforms.forEach(p=>{
        ctx.fillRect(p.x - camera.x, p.y - camera.y, p.w, p.h);
    });

    // 로프
    if(rope.active){
        ctx.beginPath();
        ctx.moveTo(player.x - camera.x, player.y - camera.y);
        ctx.lineTo(rope.x - camera.x, rope.y - camera.y);
        ctx.strokeStyle = "#fff";
        ctx.stroke();
    }

    // 플레이어
    ctx.beginPath();
    ctx.arc(player.x - camera.x, player.y - camera.y, player.radius, 0, Math.PI*2);
    ctx.fillStyle = "#00ffcc";
    ctx.fill();

    update();
    requestAnimationFrame(draw);
}

draw();

window.addEventListener("resize", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
