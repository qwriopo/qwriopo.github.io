<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mouse Behavior Collection</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
}

#startScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
    z-index:100;
}

#startBtn{
    padding:20px 40px;
    font-size:24px;
    cursor:pointer;
}

#target{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    background:red;
    display:none;
    cursor:pointer;
}

#info{
    position:fixed;
    top:10px;
    left:10px;
    background:white;
    padding:10px;
    border:1px solid #ccc;
}
</style>
</head>
<body>

<div id="startScreen">
    <button id="startBtn">테스트 시작</button>
</div>

<div id="info">
    남은 목표: <span id="remain">30</span>
</div>

<div id="target"></div>

<script>

const TOTAL_TARGETS = 30;

let remaining = TOTAL_TARGETS;

const target = document.getElementById("target");
const remainText = document.getElementById("remain");

const userId = crypto.randomUUID();
const sessionId = crypto.randomUUID();

let startTime = null;

const events = [];

function now(){
    return performance.now();
}

function record(type,x,y){
    events.push({
        userId,
        sessionId,
        type,
        x,
        y,
        t: now()
    });
}

document.addEventListener("mousemove",(e)=>{
    if(startTime===null) return;

    record(
        "move",
        e.clientX,
        e.clientY
    );
});

function placeTarget(){

    const size = 50;

    const x =
        Math.random() *
        (window.innerWidth-size);

    const y =
        Math.random() *
        (window.innerHeight-size);

    target.style.left = x+"px";
    target.style.top = y+"px";
    target.style.display = "block";
}

target.addEventListener("click",(e)=>{

    record(
        "click",
        e.clientX,
        e.clientY
    );

    remaining--;

    remainText.textContent = remaining;

    if(remaining<=0){
        finishTest();
        return;
    }

    placeTarget();
});

function finishTest(){

    target.style.display="none";

    const result = {
        userId,
        sessionId,
        finishedAt: Date.now(),
        events
    };

    const blob = new Blob(
        [JSON.stringify(result,null,2)],
        {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download =
        `mouse_data_${sessionId}.json`;

    a.click();

    alert("테스트 완료!");
}

document
.getElementById("startBtn")
.addEventListener("click",()=>{

    document
    .getElementById("startScreen")
    .remove();

    startTime = now();

    placeTarget();
});

</script>

</body>
</html>
