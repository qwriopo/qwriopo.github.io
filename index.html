<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마우스 행동 데이터 수집</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
}

#overlay{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
    z-index:1000;
}

#startBtn{
    padding:20px 40px;
    font-size:24px;
    cursor:pointer;
}

#target{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    background:red;
    display:none;
    cursor:pointer;
}

#info{
    position:fixed;
    top:10px;
    left:10px;
    background:white;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}
</style>
</head>
<body>

<div id="overlay">
    <button id="startBtn">테스트 시작</button>
</div>

<div id="info">
    남은 목표:
    <span id="remain">20</span>
</div>

<div id="target"></div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwzzlRpzbxMC4XAd0zHoNueq-oRjx6raQ49PILvdhvlKgA8d2jHx8480CATMAyKsE08lw/exec";

const TARGET_COUNT = 20;

const target = document.getElementById("target");
const remain = document.getElementById("remain");

const userId = crypto.randomUUID();
const sessionId = crypto.randomUUID();

let clicks = 0;
let lastTargetTime = 0;

let reactionTimes = [];
let totalDistance = 0;
let speedSamples = [];

let prevMouse = null;

document.addEventListener("mousemove", e => {

    const now = performance.now();

    if(prevMouse){

        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;

        const dist = Math.sqrt(dx*dx + dy*dy);
        const dt = now - prevMouse.t;

        if(dt > 0){

            totalDistance += dist;
            speedSamples.push(dist / dt);
        }
    }

    prevMouse = {
        x:e.clientX,
        y:e.clientY,
        t:now
    };
});

function placeTarget(){

    const size = 50;

    const x =
        Math.random() *
        (window.innerWidth - size);

    const y =
        Math.random() *
        (window.innerHeight - size);

    target.style.left = x + "px";
    target.style.top = y + "px";
    target.style.display = "block";

    lastTargetTime = performance.now();
}

target.addEventListener("click", () => {

    const rt =
        performance.now() -
        lastTargetTime;

    reactionTimes.push(rt);

    clicks++;

    remain.textContent =
        TARGET_COUNT - clicks;

    if(clicks >= TARGET_COUNT){
        finishTest();
        return;
    }

    placeTarget();
});

function average(arr){

    if(arr.length === 0){
        return 0;
    }

    return arr.reduce(
        (a,b)=>a+b,0
    ) / arr.length;
}

async function finishTest(){

    target.style.display = "none";

    const payload = {

        userId,
        sessionId,

        targetCount:
            TARGET_COUNT,

        avgReactionTime:
            Math.round(
                average(reactionTimes)
            ),

        avgSpeed:
            Number(
                average(speedSamples)
                .toFixed(4)
            ),

        totalDistance:
            Math.round(totalDistance)
    };

    try{

        const response =
            await fetch(
                SCRIPT_URL,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                        "application/json"
                    },
                    body:
                    JSON.stringify(payload)
                }
            );

        console.log(
            await response.text()
        );

        alert(
            "제출 완료! 감사합니다."
        );

    }catch(err){

        console.error(err);

        alert(
            "데이터 전송 실패\nF12 콘솔을 확인해주세요."
        );
    }
}

document
.getElementById("startBtn")
.addEventListener(
"click",
() => {

    document
    .getElementById("overlay")
    .remove();

    placeTarget();
});

</script>

</body>
</html>
